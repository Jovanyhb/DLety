<!doctype html>
<html>
  <head>
    <title>Editar Producto</title>
  </head>
  <body>
    <h1>Editar Producto</h1>
    <form method="POST">
      <label>Nombre:</label>
      <input
        type="text"
        name="nombre"
        value="{{producto[1]}}"
        required
      /><br /><br />

      <label>Cantidad:</label>
      <input
        type="number"
        name="cantidad"
        value="{{producto[2]}}"
        required
      /><br /><br />

      <label>Precio:</label>
      <input
        type="number"
        step="0.01"
        name="precio"
        value="{{producto[3]}}"
        required
      /><br /><br />

      <button type="submit">Actualizar</button>
    </form>
    <br />
    <a href="/">Volver al inventario</a>
  </body>
</html>
